<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Library and shelf tests</title>
<link rel="stylesheet" href="../src/ui/style.css"/>
<style>
  body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 24px; max-width: 900px; }
  h1 { font-size: 16px; }
  .pass { color: #1a7f37; }
  .fail { color: #cf222e; font-weight: 700; }
  #summary { font-size: 16px; font-weight: 700; padding: 12px; margin: 16px 0; border: 2px solid; }
  iframe { position: absolute; left: -9999px; border: 0; }
</style>
</head>
<body>
<h1>EPUB converter — library storage and the shelf</h1>
<div id="summary">running…</div>
<ul id="results"></ul>

<script src="../vendor/jszip.min.js"></script>
<script src="../vendor/opencc-cn2t.js"></script>
<script src="../src/ui/strings.js"></script>
<script src="../src/epub/zip.js"></script>
<script src="../src/epub/parse.js"></script>
<script src="../src/convert/ambiguity-table.js"></script>
<script src="../src/convert/text.js"></script>
<script src="../src/convert/book.js"></script>
<script src="../src/reader/fonts.js"></script>
<script src="../src/reader/render.js"></script>
<script src="../src/reader/nav.js"></script>
<script src="../src/ui/library.js"></script>
<script src="fixtures.js"></script>
<script src="harness.js"></script>
<script>
(function () {
  'use strict';
  var t = Harness.create('results', 'summary');
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* Books that deliberately share a dc:identifier -- the case that used to
     destroy data when identity came from metadata. */
  /* `Zip` lets a caller build the file in another realm. Handing an
     ArrayBuffer made here into the iframe fails: JSZip detects types with
     instanceof, which does not hold across realms, so loadAsync rejects and
     the book silently never opens. */
  function make(title, paras, identifier, Zip, withCover) {
    var zip = new (Zip || JSZip)();
    zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });
    zip.folder('META-INF').file('container.xml',
      '<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">' +
      '<rootfiles><rootfile full-path="c.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
    zip.file('c.opf',
      '<?xml version="1.0"?><package xmlns="http://www.idpf.org/2007/opf" version="2.0" unique-identifier="i">' +
      '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>' + title + '</dc:title>' +
      '<dc:language>zh-CN</dc:language><dc:identifier id="i">' +
      (identifier || 'urn:uuid:SHARED') + '</dc:identifier>' +
      (withCover ? '<meta name="cover" content="cov"/>' : '') + '</metadata>' +
      '<manifest><item id="c1" href="a.xhtml" media-type="application/xhtml+xml"/>' +
      (withCover ? '<item id="cov" href="cover.png" media-type="image/png"/>' : '') +
      '</manifest>' +
      '<spine><itemref idref="c1"/></spine></package>');
    var body = '';
    for (var i = 0; i < paras; i++) body += '<p>第' + i + '段：她的头发很长，房间很干净。</p>';
    zip.file('a.xhtml',
      '<?xml version="1.0"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">' +
      '<head><title>x</title></head><body>' + body + '</body></html>');
    /* fixtures.js already keeps a 1x1 PNG and exports it. The bytes do not
       matter -- the box is sized in CSS -- but the manifest entry does:
       findCoverPath wants a real image/ media type. */
    if (withCover) zip.file('cover.png', App.fixtures.PNG_B64, { base64: true });
    return zip.generateAsync({ type: 'arraybuffer' });
  }

  function wipe() {
    return new Promise(function (r) {
      var q = indexedDB.deleteDatabase('epub-tc');
      q.onsuccess = q.onerror = q.onblocked = function () { r(); };
    });
  }

  async function run() {
    try {
      await wipe();

      // ---- content identity ----
      var a = await make('書甲', 3);
      var b = await make('書乙', 40);          // same identifier, different content
      /* The same BYTES, not a rebuild. contentKey hashes bytes, and JSZip
         stamps every entry -- files and directories alike -- with the current
         time at DOS's two-second resolution, so two builds of the same fixture
         either side of a bucket boundary genuinely differ. Re-dropping a file
         is the case this models, and that is the same bytes. */
      var aCopy = a.slice(0);

      t.check('a book carries a content id', !!(await App.parse.load(a)).contentId, 'missing');
      t.eq('identical bytes hash identically',
           App.zip.contentKey(a), App.zip.contentKey(aCopy));
      t.check('different content hashes differently',
              App.zip.contentKey(a) !== App.zip.contentKey(b), 'collision');
      t.check('the hash includes length',
              App.zip.contentKey(a).indexOf(a.byteLength.toString(36)) >= 0,
              App.zip.contentKey(a));

      var bookA = await App.parse.load(a), bookB = await App.parse.load(b);
      t.eq('metadata identifiers really are shared',
           bookA.metadata.identifier, bookB.metadata.identifier);
      t.check('but library keys differ', App.library.idFor(bookA) !== App.library.idFor(bookB),
              'keys collided despite different content');
      t.check('and reading-position keys differ too',
              App.reader.hashKey(bookA) !== App.reader.hashKey(bookB), 'position keys collided');
      t.eq('hashKey is derived from the content id',
           App.reader.hashKey(bookA), 'epub-tc:' + bookA.contentId);

      // ---- storage ----
      t.check('library is available over http', App.library.available(), App.library.reason());

      await App.library.save(bookA, a, 'a.epub');
      await App.library.save(bookB, b, 'b.epub');
      var both = await App.library.list();
      t.eq('two books with one identifier both persist', both.length, 2);
      t.check('and both are recoverable byte for byte',
              (await App.library.load(App.library.idFor(bookA))).byteLength === a.byteLength &&
              (await App.library.load(App.library.idFor(bookB))).byteLength === b.byteLength,
              'a stored book came back wrong');

      await App.library.save(await App.parse.load(aCopy), aCopy, 'a-again.epub');
      t.eq('re-adding the same file does not duplicate', (await App.library.list()).length, 2);

      /* And opening a stored book WRITES NOTHING.
       *
       * IndexedDB has no partial update -- put() replaces the whole object,
       * and the object carries the entire EPUB -- so stamping lastOpenedAt on
       * the record used to write the book again, and save() then wrote it a
       * second time because it runs on every open. Two whole copies per open.
       * WebKit does not reclaim the overwritten ones promptly, so on a phone a
       * 382KB book was reported as 17.2MB and climbed every time it was
       * opened. Counted here rather than measured, because the growth is the
       * browser's to reveal and only the writes are ours. */
      var puts = 0;
      var realPut = IDBObjectStore.prototype.put;
      IDBObjectStore.prototype.put = function () { puts++; return realPut.apply(this, arguments); };
      try {
        var idA = App.library.idFor(bookA);
        await App.library.load(idA);
        await App.library.save(bookA, a, 'a.epub');
        t.eq('opening a stored book writes nothing', puts, 0);
      } finally {
        IDBObjectStore.prototype.put = realPut;
      }

      /* The timestamp still moves, which is what the record was being
         rewritten FOR: the shelf sorts on it and the row reads "today". */
      var seen = (await App.library.list()).filter(function (x) { return x.id === App.library.idFor(bookA); })[0];
      t.check('but the book still counts as opened just now',
              seen && Date.now() - seen.lastOpenedAt < 60000,
              seen ? String(seen.lastOpenedAt) : 'the book vanished from the list');

      var refused = await App.library.save(bookA, { byteLength: App.library.MAX_BYTES + 1 }, 'huge');
      t.check('an oversized book is refused with a reason',
              !refused.saved && /Too large/.test(refused.reason), JSON.stringify(refused));

      await App.library.remove(App.library.idFor(bookB));
      t.eq('removal works', (await App.library.list()).length, 1);
      t.eq('a removed book loads as null', await App.library.load(App.library.idFor(bookB)), null);

      /* save() returns early when a row already holds the bytes, which is what
         stopped it rewriting a whole EPUB on every open. A row stored before
         covers were kept would therefore never get one -- harmless while such
         a row simply showed no picture, and not harmless now that a missing
         cover is DRAWN: the shelf would assert, in a frame of its own, that a
         book with artwork has none. The legacy row is built here by reaching
         into IndexedDB directly, because no version of save() produces one. */
      var artBytes = await make('有封面的書', 3, 'urn:uuid:COVER', null, true);
      var artBook = await App.parse.load(artBytes);
      var artId = App.library.idFor(artBook);
      var rowFor = async function (id) {
        return (await App.library.list()).filter(function (x) { return x.id === id; })[0];
      };
      await App.library.save(artBook, artBytes, 'art.epub');
      t.check('a book whose EPUB has a cover stores one', !!(await rowFor(artId)).cover,
              'no cover was extracted -- the fixture, not the fix, is wrong');

      await new Promise(function (resolve, reject) {
        var q = indexedDB.open('epub-tc');
        q.onsuccess = function () {
          var db = q.result, txn = db.transaction('books', 'readwrite');
          var store = txn.objectStore('books'), get = store.get(artId);
          get.onsuccess = function () {
            var legacy = get.result;
            delete legacy.cover;
            delete legacy.coverType;
            store.put(legacy);
          };
          txn.oncomplete = function () { db.close(); resolve(); };
          txn.onerror = function () { db.close(); reject(txn.error); };
        };
        q.onerror = function () { reject(q.error); };
      });
      t.check('a row from before covers existed has none', !(await rowFor(artId)).cover,
              'the cover survived, so this proves nothing');

      await App.library.save(artBook, artBytes, 'art.epub');
      t.check('and opening it again fills the cover in', !!(await rowFor(artId)).cover,
              'the book keeps claiming it has no artwork');

      // ---- the shelf, in the running app ----
      await wipe();
      var frame = await new Promise(function (resolve) {
        var f = document.createElement('iframe');
        f.width = 1000; f.height = 700; f.src = '/index.html';
        f.onload = function () { resolve(f); };
        document.body.appendChild(f);
      });
      var W = frame.contentWindow, D = frame.contentDocument;
      try { W.localStorage.clear(); } catch (e) { /* ignore */ }

      /* One with a cover and one without: the mixed shelf the placeholder
         exists for. */
      await W.App.ui.loadBuffer(await make('第一本書', 6, null, W.JSZip, true), 'one.epub');
      await wait(400);
      await W.App.ui.loadBuffer(await make('第二本書', 30, null, W.JSZip), 'two.epub');
      await wait(400);

      t.check('both books opened in the frame', !!W.App.ui.current.book,
              'loadBuffer failed: ' + (D.getElementById('error').textContent || 'no error shown'));

      var rows = function () { return Array.prototype.slice.call(D.querySelectorAll('.shelf-row')); };
      var titles = function () { return rows().map(function (r) { return r.querySelector('.t').textContent; }); };
      var panel = function () { return D.getElementById('shelfPanel'); };

      /* The shelf is its own control on the bar, not a tab inside the table of
         contents: "which book" and "where in this book" are different
         questions, and nesting one inside the other hid the first. */
      /* Labels come from one table: the markup carries keys and apply() fills
         them, so a second language is a column rather than a hunt. */
      var keyed = D.querySelectorAll('[data-i18n], [data-i18n-title], [data-i18n-label]');
      t.check('the app markup carries keys', keyed.length >= 15, String(keyed.length));
      t.check('and every one of them was filled in',
              Array.prototype.every.call(keyed, function (node) {
                /* Three kinds of key, and one node may carry two: a mark on the
                   bar has a title and a label and no text at all. */
                var key = node.getAttribute('data-i18n');
                if (key) {
                  var shown = node.textContent.trim();
                  if (!shown || shown === key) return false;
                }
                if (node.hasAttribute('data-i18n-title') && !node.getAttribute('title')) return false;
                if (node.hasAttribute('data-i18n-label') && !node.getAttribute('aria-label')) return false;
                return true;
              }), 'a key was left showing');

      /* The four marks carry no word at all. It moved to aria-label, so a name
         kept for a screen reader is not also a box in the layout: on iOS a
         zeroed font size is not a promise -- text inflates to a minimum, and
         an inflated label sits AFTER the mark, which is a gap on its right and
         nowhere else. Reported twice from a phone, reproducible on no desktop
         engine, because text autosizing is not something a desktop engine
         does. */
      ['toggleShelf', 'toggleSidebar', 'toggleBookmark', 'docBtn'].forEach(function (id) {
        var marked = D.getElementById(id);
        t.eq(id + ' carries no text that could inflate', marked.textContent.trim(), '');
        t.check(id + ' is still named for a screen reader',
                !!marked.getAttribute('aria-label'), 'no accessible name');
      });

      /* The number beside "books stored" has to BE the books. It used to come
         from navigator.storage.estimate(), which answers a different question
         -- everything this origin holds, the app's own bytes included, and on
         WebKit IndexedDB space the browser has not reclaimed yet. One 382KB
         book reported as 17.2MB on a phone, under a line naming the books.
         The way to know it is the books is that it equals their own sizes
         added up, which is also what the rows above it show. The rule is
         spelled out here rather than borrowed from the app, so the test
         states it independently. */
      await W.App.ui.renderLibrary();
      var stored = await W.App.library.list();
      var sum = stored.reduce(function (n, b) { return n + b.size; }, 0);
      var expect = sum >= 1048576 ? (sum / 1048576).toFixed(1) + ' MB'
                                  : Math.round(sum / 1024) + ' KB';
      var note = D.getElementById('libraryNote').textContent;
      t.check('the storage line reports the books, not the whole origin',
              stored.length === 2 && sum > 0 && note.indexOf(expect) >= 0,
              stored.length + ' book(s), expected ' + expect + ', note: ' + note);

      /* The contents list outruns the sidebar on any real book, so it has to
         follow the reader -- opening 目錄 at chapter 31 used to show the start
         of the book. `nearest` is what keeps it civil: an entry already on
         screen must not move when the highlight lands on it. */
      var tocEl = D.getElementById('toc');
      for (var ti = 0; ti < 60; ti++) {
        var link = D.createElement('a');
        link.href = '#';
        link.style.display = 'block';
        link.dataset.path = 'chapter-' + ti;
        link.textContent = '第' + ti + '章';
        tocEl.appendChild(link);
      }
      var sideEl = D.getElementById('sidebar');
      t.check('the contents list is long enough to scroll',
              sideEl.scrollHeight > sideEl.clientHeight, 'not scrollable');

      W.App.ui.highlightToc('chapter-55');
      await wait(80);
      var far = tocEl.querySelector('a.current');

      /* Chinese headings, not English ones dressed up. uppercase does nothing
         to 目錄 or 書架 and the letter-spacing only pushes two characters
         apart; both headings lost the treatment together, having drifted
         apart once already when only one of them was fixed. */
      ['#library h2', '.sidebar h2'].forEach(function (sel) {
        var heading = D.querySelector(sel);
        t.eq(sel + ' is not shouted in an English style',
             heading ? W.getComputedStyle(heading).textTransform : '(missing)', 'none');
      });

      /* And the current chapter is marked by colour and weight rather than by
         a filled block: the accent is a border or a letterform everywhere in
         this app except the drop zone, which is deliberate and would mean less
         if a contents list shouted too. */
      var probe = D.createElement('span');
      probe.style.background = 'var(--accent)';
      D.body.appendChild(probe);
      var accent = W.getComputedStyle(probe).backgroundColor;
      probe.remove();
      var curStyle = W.getComputedStyle(far);
      t.check('the current chapter is not a filled accent block',
              curStyle.backgroundColor !== accent, curStyle.backgroundColor);
      t.eq('it is the accent in the letters instead', curStyle.color, accent);
      t.check('and carries weight', Number(curStyle.fontWeight) >= 600, curStyle.fontWeight);
      var farBox = far.getBoundingClientRect(), sideBox = sideEl.getBoundingClientRect();
      t.check('a distant chapter is scrolled into view',
              farBox.top >= sideBox.top - 1 && farBox.bottom <= sideBox.bottom + 1,
              'still out of sight');
      t.check('which meant scrolling the list', sideEl.scrollTop > 0,
              String(sideEl.scrollTop));

      var restingAt = sideEl.scrollTop;
      W.App.ui.highlightToc('chapter-55');
      await wait(80);
      t.eq('re-marking an entry already on screen moves nothing',
           sideEl.scrollTop, restingAt);

      /* The bar's top border is a second rendering of the figure beside it, so
         what matters is that they agree -- pinning a width would only measure
         this machine. Within a point, because the text is rounded to a whole
         percent and the border is not. */
      var readVar = D.querySelector('.pager').style.getPropertyValue('--read');
      var shownPct = /(\d+)%/.exec(D.getElementById('position').textContent);
      t.check('the pager carries a read fraction', /%$/.test(readVar), readVar || '(unset)');
      t.check('and it agrees with the percentage printed beside it',
              !!shownPct && Math.abs(parseFloat(readVar) - Number(shownPct[1])) <= 1,
              readVar + ' vs ' + (shownPct ? shownPct[1] + '%' : 'no percentage shown'));

      t.check('the bar carries a shelf button', !!D.getElementById('toggleShelf'), 'missing');
      t.eq('it is the first control on the bar',
           D.querySelector('.topbar button').id, 'toggleShelf');
      t.check('the shelf starts closed', panel().classList.contains('hidden'), 'open at load');

      D.getElementById('toggleShelf').click();
      await wait(200);
      t.check('the button opens it', !panel().classList.contains('hidden'), 'did not open');
      t.check('and the table of contents is untouched',
              !D.getElementById('toc').classList.contains('hidden'), 'toc was hidden');
      t.eq('both books are on the shelf', rows().length, 2);
      t.check('the book being read is marked',
              rows().some(function (r) { return r.classList.contains('current'); }), 'none marked');

      /* A book with no cover still takes the cover's box, or the titles in a
         mixed list start at two different x positions -- 34px apart here (a
         26px thumbnail and an 8px gap; it is 46px in the library list, whose
         cover and gap are both bigger), which is every row without artwork
         jutting left. Row is compared against row inside one render rather
         than against a pixel figure, so the machine's fonts cannot decide it;
         and the width is asserted FIRST because two rows in a hidden panel
         both measure zero and would agree perfectly.

         The measuring is inside the shape check because t.check RECORDS a
         failure and returns -- it does not throw. A missing row would
         therefore reach getBoundingClientRect on undefined, and that
         TypeError unwinds to the page's catch, taking the ~25 assertions
         after this one with it. */
      var covered = rows().filter(function (r) { return !!r.querySelector('img.cover'); })[0];
      var bare = rows().filter(function (r) { return !r.querySelector('img.cover'); })[0];
      t.check('the two fixtures differ: one has a cover, one has none',
              !!covered && !!bare, 'both rows came out the same');
      if (covered && bare) {
        var titleLeft = function (r) { return r.querySelector('.t').getBoundingClientRect().left; };
        t.check('the shelf is really laid out', titleLeft(covered) > 0, 'rows measure zero');
        t.eq('a coverless title lines up with a covered one',
             Math.round(titleLeft(bare)), Math.round(titleLeft(covered)));
        t.check('because the empty slot is still drawn',
                !!bare.querySelector('.cover.blank'), 'no placeholder in the row');
      }

      /* The other half of renderRows. The library list has its own cover size
         and its own gap, so a rule scoped to .shelf-row could keep this green
         while the landing page came apart. It is hidden once a book is open --
         and a hidden row measures zero, which would agree with anything -- so
         it is shown for the measurement and put back. */
      await W.App.ui.renderLibrary();
      var landing = D.getElementById('landing');
      var landingWasHidden = landing.classList.contains('hidden');
      landing.classList.remove('hidden');
      var libRows = Array.prototype.slice.call(D.querySelectorAll('.library-row'));
      var libCovered = libRows.filter(function (r) { return !!r.querySelector('img.cover'); })[0];
      var libBare = libRows.filter(function (r) { return !r.querySelector('img.cover'); })[0];
      t.check('the landing list holds one of each as well',
              !!libCovered && !!libBare, libRows.length + ' row(s)');
      if (libCovered && libBare) {
        var nameLeft = function (r) { return r.querySelector('.name').getBoundingClientRect().left; };
        t.check('the landing list is really laid out', nameLeft(libCovered) > 0, 'rows measure zero');
        t.eq('a coverless title lines up there too',
             Math.round(nameLeft(libBare)), Math.round(nameLeft(libCovered)));
      }
      if (landingWasHidden) landing.classList.add('hidden');

      /* A 0-byte cover.png is still an object, so a truthiness test took the
         image branch and drew an empty frame with no initial in it -- the
         degraded row this change exists to remove. The list is stubbed rather
         than a third fixture added, so the counts every other assertion here
         relies on stay put. */
      var realList = W.App.library.list;
      W.App.library.list = async function () {
        return [{ id: 'zero', title: '空封面', size: 1,
                  cover: new W.Uint8Array(0), coverType: 'image/png' }];
      };
      await W.App.ui.renderShelf();
      var zeroRow = D.querySelector('.shelf-row');
      t.check('a zero-byte cover falls back to the placeholder',
              !!(zeroRow && zeroRow.querySelector('.cover.blank')),
              'drew an empty image instead');
      W.App.library.list = realList;
      await W.App.ui.renderShelf();
      t.eq('and the real shelf comes back', rows().length, 2);

      /* 《圍城》 filed under 《, and every English title that opens with an
         article filed under T, is a placeholder that distinguishes nothing.
         Every case below returned the wrong character at some point; the
         first version of this test asserted only the two that already
         worked, which is how a suite written from the code reads as proof. */
      t.eq('a bracketed title uses the first real character',
           W.App.ui.initialOf('《圍城》'), '圍');
      t.eq('including the brackets a scraped Chinese title actually carries',
           W.App.ui.initialOf('【完結】圍城'), '圍');
      t.eq('and a fullwidth volume marker',
           W.App.ui.initialOf('（上）圍城'), '圍');
      t.eq('and the other quotation pair this app itself emits',
           W.App.ui.initialOf('『雪國』'), '雪');
      t.eq('an English article is not the initial',
           W.App.ui.initialOf('The Left Hand of Darkness', 'en'), 'L');
      t.eq('and another one does not collide with it',
           W.App.ui.initialOf('The Dispossessed', 'en'), 'D');
      t.eq('an article hiding a quote does not leave the quote behind',
           W.App.ui.initialOf('The “Genius” Myth', 'en'), 'G');
      t.eq('a bracket hiding an article does not leave the article behind',
           W.App.ui.initialOf('《The Dispossessed》', 'en'), 'D');
      t.eq('a leading A in Spanish is a preposition, not an article',
           W.App.ui.initialOf('A sangre fría', 'es'), 'A');
      t.eq('and a book that never said which language it is keeps its article',
           W.App.ui.initialOf('The Dispossessed'), 'T');
      /* 𠮟 is U+20B9F, a surrogate pair. charAt(0) returned U+D842 alone,
         which paints as a replacement box -- the same hazard reader/nav.js
         documents for the ambiguity candidates. */
      t.eq('an astral character is not cut in half',
           W.App.ui.initialOf('𠮟責の書'), '𠮟');
      t.eq('and neither is an emoji, which is simply not a letter',
           W.App.ui.initialOf('📚 Reading list', 'en'), 'R');
      t.eq('a title with nothing to show leaves the frame empty',
           W.App.ui.initialOf(''), '');

      // switch
      var target = rows()[titles().indexOf('第一本書')];
      target.querySelector('.pick').click();
      await wait(900);
      t.eq('picking another book switches to it',
           W.App.ui.current.book.metadata.title, '第一本書');
      t.check('and closes the shelf behind it',
              panel().classList.contains('hidden'), 'shelf stayed open');

      // clicking away dismisses it
      D.getElementById('toggleShelf').click();
      await wait(120);
      D.body.click();
      await wait(120);
      t.check('clicking outside closes the shelf',
              panel().classList.contains('hidden'), 'still open');

      // remove one that is not open
      D.getElementById('toggleShelf').click();
      await wait(200);
      var other = rows()[titles().indexOf('第二本書')];
      other.querySelector('.drop').click();
      await wait(400);
      t.eq('removing a book drops it from the shelf', rows().length, 1);
      t.eq('and the current book keeps reading',
           W.App.ui.current.book.metadata.title, '第一本書');

      // remove the one being read
      rows()[0].querySelector('.drop').click();
      await wait(400);
      t.eq('the open book can be removed too', rows().length, 0);
      t.check('and the reader carries on',
              !!W.App.ui.current.reader.content.querySelector('p'), 'reader broke');
      /* The landing page holds the dropzone and is hidden while reading, so the
         shelf carries the only click or keyboard route to the file picker.
         Opening it programmatically dispatches a click on the input, which
         bubbles -- and used to close the shelf out from under the button. */
      /* Toggling blind depends on whatever the previous assertion left open. */
      var setShelf = function (open) {
        if (panel().classList.contains('hidden') === open) {
          D.getElementById('toggleShelf').click();
        }
      };
      setShelf(true);
      await wait(150);
      var openNew = D.getElementById('openNew');
      var picks = 0;
      D.getElementById('fileInput').addEventListener('click', function () { picks++; });
      t.check('the shelf offers a way to open a file',
              !!openNew && openNew.getClientRects().length > 0, 'missing or hidden');
      /* At the foot, and sticky: the panel scrolls past roughly six books, so a
         button at either plain end goes missing -- the top one when you scroll
         down, the bottom one until you do. The list leads because the shelf is
         sorted most-recent-first. */
      var foot = D.querySelector('.shelf-foot');
      t.check('it sits below the list', !!foot &&
              (foot.compareDocumentPosition(D.getElementById('shelfList')) &
               Node.DOCUMENT_POSITION_PRECEDING) !== 0,
              'the action is above the books');
      t.eq('and stays put while the list scrolls',
           W.getComputedStyle(foot).position, 'sticky');
      openNew.click();
      await wait(150);
      t.eq('it opens the picker', picks, 1);
      t.check('and the shelf stays open behind it',
              !panel().classList.contains('hidden'), 'shelf closed itself');

      setShelf(true);
      await wait(120);
      t.check('the empty shelf explains itself',
              /還沒有存書/.test(D.getElementById('shelfNote').textContent),
              D.getElementById('shelfNote').textContent);

      /* ---- the palette scale ----
         Every theme has to hold the same three relationships or the chrome and
         the page are the same colour and every edge in the app rests on a
         hairline, which is what all seven did until 2026-09-08: panel/bg ran
         from 1.04 in 明亮 to 1.15, and the two marks drawn in that gap --
         .toc a.current and .shelf-row.current, both --bg on a --panel ground --
         could not be seen at all.

         Read out of the stylesheet rather than off a rendered element, because
         the dark variant of "system" lives behind a prefers-color-scheme query
         that no script can switch on; walking the rules checks it with the
         rest. Pure arithmetic on declared hex, so nothing here depends on the
         machine. */
      function luminance(hex) {
        var c = [1, 3, 5].map(function (i) {
          return parseInt(hex.substr(i, 2), 16) / 255;
        }).map(function (v) {
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      }
      function contrast(a, b) {
        var l1 = luminance(a), l2 = luminance(b);
        return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
      }

      var sheet = null;
      for (var si = 0; si < document.styleSheets.length; si++) {
        if (/style\.css$/.test(document.styleSheets[si].href || '')) {
          sheet = document.styleSheets[si];
        }
      }
      t.check('the stylesheet can be read', !!sheet,
              'no style.css among ' + document.styleSheets.length + ' sheets');

      var palettes = [];
      (function collect(rules, prefix) {
        for (var i = 0; i < rules.length; i++) {
          var r = rules[i];
          if (r.cssRules && r.media) { collect(r.cssRules, 'dark-OS '); continue; }
          if (!r.selectorText || r.selectorText.indexOf(':root') !== 0) continue;
          var bg = r.style.getPropertyValue('--bg').trim();
          if (!bg) continue;
          var named = /data-theme="(\w+)"/.exec(r.selectorText);
          palettes.push({
            name: prefix + (named ? named[1] : 'green'),
            bg: bg,
            panel: r.style.getPropertyValue('--panel').trim(),
            line: r.style.getPropertyValue('--line').trim(),
            muted: r.style.getPropertyValue('--muted').trim()
          });
        }
      })(sheet.cssRules, '');

      t.eq('every theme declares a full palette', palettes.length, 7);
      palettes.forEach(function (p) {
        var panelBg = contrast(p.bg, p.panel);
        var linePanel = contrast(p.panel, p.line);
        var mutedPanel = contrast(p.panel, p.muted);
        t.check(p.name + ': the chrome is a surface of its own',
                panelBg >= 1.15, 'panel/bg ' + panelBg.toFixed(2));
        t.check(p.name + ': a border still reads on that surface',
                linePanel >= 1.25, 'line/panel ' + linePanel.toFixed(2));
        t.check(p.name + ': the fine print stays legible on it',
                mutedPanel >= 4.5, 'muted/panel ' + mutedPanel.toFixed(2));
      });

      frame.remove();
      await wipe();
    } catch (e) {
      t.check('unexpected exception', false, e && (e.stack || e.message));
    }
    t.finish();
  }

  run();
})();
</script>
</body>
</html>
