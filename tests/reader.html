<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Reader tests</title>
<!-- The theme tokens live here; without it the theme assertions have nothing
     to match against. Page-specific rules below intentionally follow it. -->
<link rel="stylesheet" href="../src/ui/style.css"/>
<style>
  body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 24px; max-width: 900px; }
  h1 { font-size: 16px; }
  .pass { color: #1a7f37; }
  .fail { color: #cf222e; font-weight: 700; }
  #summary { font-size: 16px; font-weight: 700; padding: 12px; margin: 16px 0; border: 2px solid; }
  #stage { position: absolute; left: -9999px; width: 600px; height: 400px; overflow: auto; }
</style>
</head>
<body>
<h1>EPUB converter — phase 2 (reader) tests</h1>
<div id="summary">running…</div>
<ul id="results"></ul>
<div id="stage"></div>

<script src="../vendor/jszip.min.js"></script>
<script src="../vendor/opencc-cn2t.js"></script>
<script src="../src/epub/zip.js"></script>
<script src="../src/epub/parse.js"></script>
<script src="../src/convert/ambiguity-table.js"></script>
<script src="../src/convert/text.js"></script>
<script src="../src/convert/book.js"></script>
<script src="../src/reader/render.js"></script>
<script src="../src/reader/fonts.js"></script>
<script src="../src/reader/nav.js"></script>
<script src="../src/reader/keys.js"></script>
<script src="../src/ui/theme.js"></script>
<script src="../src/ui/library.js"></script>
<script src="harness.js"></script>
<script src="fixtures.js"></script>
<script>
(function () {
  'use strict';
  var t = Harness.create('results', 'summary');

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function run() {
    try {
      // ---- CSS scoping ----
      t.eq('selector body -> :host', App.reader.scopeSelector('body'), ':host');
      t.eq('selector html -> :host', App.reader.scopeSelector('html'), ':host');
      t.eq('descendant body p -> p', App.reader.scopeSelector('body p'), 'p');
      t.eq('body.night -> :host.night', App.reader.scopeSelector('body.night'), ':host.night');
      t.eq('selector list handled', App.reader.scopeSelector('body, .x'), ':host, .x');
      t.eq('unrelated selector untouched', App.reader.scopeSelector('.body-text'), '.body-text');

      var css = App.reader.scopeCss(
        '@page { margin: 2em } body { margin: 5% } @media screen { body { color: red } }' +
        '@font-face { font-family: "Subset CN"; src: url(a.ttf) }',
        { stripFontFace: true });
      t.check('@page dropped', css.indexOf('@page') < 0, css);
      t.check('body scoped to :host', css.indexOf(':host{') >= 0 || css.indexOf(':host {') >= 0, css);
      t.check('@media preserved and recursed', /@media\s+screen\s*\{\s*:host\s*\{/.test(css), css);
      t.check('@font-face stripped when asked', css.indexOf('@font-face') < 0, css);
      var kept = App.reader.scopeCss('@font-face { font-family: X; src: url(a.ttf) }', {});
      t.check('@font-face kept when not asked', kept.indexOf('@font-face') >= 0, kept);

      // ---- render a real converted book ----
      var buf = await App.fixtures.build('epub2');
      var book = await App.parse.load(buf);
      await App.convert.book(book, 'hk');

      var stage = document.getElementById('stage');
      var reader = App.reader.create(stage, book);
      var chapterEvents = [];
      reader.on('chapter', function (e) { chapterEvents.push(e); });

      await reader.show(0);
      var text = reader.content.textContent;
      t.has(text, '頭髮', 'chapter renders converted text');
      t.has(text, '乾淨', 'chapter renders second conversion');
      t.check('content mounted inside a shadow root',
              reader.shadow.host === reader.mount && reader.content.getRootNode() === reader.shadow,
              'not in shadow root');
      t.check('chapter event fired', chapterEvents.length === 1 && chapterEvents[0].total === 2,
              JSON.stringify(chapterEvents));

      // ---- resources became blob URLs ----
      await reader.show(1);
      var img = reader.content.querySelector('img');
      t.check('img src rewritten to blob URL', !!img && /^blob:/.test(img.getAttribute('src')),
              img ? img.getAttribute('src') : 'no img');
      t.has(reader.content.querySelector('img').getAttribute('alt'), '頭髮',
            'converted alt text survives into the reader');

      // ---- ambiguity marks ----
      var marks = reader.content.querySelectorAll('.amb-mark');
      t.check('ambiguity marks rendered', marks.length > 0, String(marks.length));
      var hou = null;
      for (var i = 0; i < marks.length; i++) {
        if (marks[i].getAttribute('data-source') === '后') { hou = marks[i]; break; }
      }
      t.check('后 is marked in the reader', !!hou, 'no 后 mark');

      if (hou) {
        var before = hou.textContent;
        var key = hou.getAttribute('data-key');
        hou.click();
        await wait(0);
        t.check('tapping a mark changes the character', hou.textContent !== before,
                before + ' -> ' + hou.textContent);
        t.check('override recorded', reader.overrides()[key] === hou.textContent,
                JSON.stringify(reader.overrides()));
        t.check('override marks the span as overridden',
                hou.getAttribute('data-overridden') === '1', 'flag not set');
      }

      // ---- context-scoped propagation, not blanket per-character ----
      /* 干部 and 干了 both resolve to 幹 by bare default, so both keep a mark
       * after the confidence filter. (皇后 no longer does: a phrase rule
       * decides it, which is exactly what the filter is for.) */
      await reader.show(0);
      var p2 = reader.content.querySelector('#p2');   // 房间很干净，他是干部，衣服干了。
      var ganMarks = p2 ? p2.querySelectorAll('.amb-mark[data-source="干"]') : [];
      t.check('both bare-default 干 occurrences are marked', ganMarks.length === 2,
              String(ganMarks.length));
      t.check('the phrase-resolved 干净 is not marked',
              p2 && p2.textContent.indexOf('乾淨') >= 0 && ganMarks.length === 2,
              'filter did not drop 干净');
      if (ganMarks.length === 2) {
        var keyA = ganMarks[0].getAttribute('data-key');
        var keyB = ganMarks[1].getAttribute('data-key');
        t.check('干部 and 干了 have different context keys', keyA !== keyB, keyA + ' vs ' + keyB);
        var otherBefore = ganMarks[1].textContent;
        ganMarks[0].click();
        await wait(0);
        t.check('flipping one leaves the other alone',
                ganMarks[1].textContent === otherBefore,
                'other occurrence changed to ' + ganMarks[1].textContent);
      }
      await reader.show(1);

      // ---- internal link interception ----
      await reader.show(1);
      var link = reader.content.querySelector('a[href^="chapter1"]');
      t.check('internal link present', !!link, 'no link');
      if (link) {
        link.click();
        await wait(50);
        t.check('internal link navigated to chapter 1', reader.state.index === 0,
                'index=' + reader.state.index);
      }

      // ---- modes ----
      await reader.setMode('vertical');
      t.has(reader.shadow.querySelector('style').textContent, 'writing-mode: vertical-rl',
            'vertical mode applied');
      await reader.setMode('scroll');
      t.has(reader.shadow.querySelector('style').textContent, 'horizontal-tb',
            'scroll mode restored');

      // ---- paged mode ----
      /* Needs a chapter long enough to spill into further columns; the short
       * fixture fits on a single page and would prove nothing. */
      var pagedHost = document.createElement('div');
      pagedHost.style.cssText = 'position:absolute;left:-9999px;width:600px;height:400px;overflow:auto';
      document.body.appendChild(pagedHost);
      var pagedBook = await App.parse.load(await App.fixtures.buildLong());
      await App.convert.book(pagedBook, 'hk');
      var paged = App.reader.create(pagedHost, pagedBook);
      await paged.show(0);

      t.eq('three reading modes', paged.MODES.join(','), 'scroll,paged,vertical');

      await paged.setMode('paged');
      var pagedCss = paged.shadow.querySelector('style').textContent;
      t.check('paged mode lays out in columns', /column-width:\s*\d+px/.test(pagedCss),
              'no pixel column width');
      t.check('columns fill top to bottom before advancing',
              /column-fill:\s*auto/.test(pagedCss), 'column-fill not set');
      t.check('paged mode scrolls horizontally',
              /overflow-x:\s*auto/.test(pagedCss) && /overflow-y:\s*hidden/.test(pagedCss),
              'wrong overflow axes');

      var advance = paged.pageAdvance();
      t.check('a page advance matches the container width', advance > 0, String(advance));

      paged.scrollToStart();
      t.eq('paged starts at the left edge', paged.scrollPosition(), 0);
      t.check('paged content overflows into further pages',
              paged.mount.scrollWidth > paged.mount.clientWidth + 10,
              paged.mount.scrollWidth + ' vs ' + paged.mount.clientWidth);

      await paged.nextPage();
      t.eq('nextPage advances exactly one page', paged.scrollPosition(), advance);
      await paged.prevPage();
      t.eq('prevPage returns exactly one page', paged.scrollPosition(), 0);

      /* Paged runs left-to-right; vertical-rl runs the other way. The sign of
       * the scroll has to follow the mode or the pages go backwards. */
      paged.scrollToStart();
      paged.scrollBy(advance);
      t.check('forward is a positive scroll in paged mode', paged.scrollPosition() > 0,
              String(paged.scrollPosition()));

      // Page turns must roll into the next chapter at the end of one.
      await paged.show(0);
      await paged.setMode('paged');
      paged.scrollToEnd();
      t.check('recognises the last page', paged.atLastPage(), 'not at last page');
      await paged.nextPage();
      await wait(80);
      t.eq('a page turn past the end moves to the next chapter', paged.state.index, 1);
      t.check('and lands at the start of it', paged.atFirstPage(),
              'position ' + paged.scrollPosition());

      await paged.prevPage();
      await wait(80);
      t.eq('a page turn before the start moves to the previous chapter',
           paged.state.index, 0);

      await paged.setMode('scroll');
      t.check('scroll mode restores vertical scrolling',
              /max-width/.test(paged.shadow.querySelector('style').textContent),
              'scroll layout not restored');

      paged.destroy();
      pagedHost.remove();

      // ---- font override ----
      /* The reader must impose its own face over the book's, because embedded
       * subset fonts cannot render the converted text. Which family that is
       * now depends on the chosen style, so assert the override mechanism
       * rather than a specific hard-coded name. */
      t.check('reader forces its own font family over the book\'s',
              /font-family:[^;]+!important/.test(reader.shadow.querySelector('style').textContent),
              'no forced font-family');
      t.check('book @font-face not carried into reader',
              reader.shadow.querySelector('style').textContent.indexOf('@font-face') < 0,
              'font-face leaked into reader');

      // ---- TOC navigation ----
      await reader.goToPath('OEBPS/text/chapter2.xhtml', 'p7');
      t.check('goToPath moved to chapter 2', reader.state.index === 1,
              'index=' + reader.state.index);

      // ---- themes ----
      var themeIds = App.theme.THEMES.map(function (x) { return x.id; });
      t.check('six themes plus system offered',
              themeIds.join(',') === 'system,light,sepia,green,slate,grey,dark', themeIds.join(','));

      App.theme.apply('sepia');
      t.eq('explicit theme stamps data-theme',
           document.documentElement.getAttribute('data-theme'), 'sepia');
      t.eq('current() reports it', App.theme.current(), 'sepia');
      var sepiaBg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      t.eq('sepia palette applied', sepiaBg, '#f3e9d2');

      App.theme.apply('grey');
      t.eq('grey palette applied',
           getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(), '#3c3c3a');

      /* Custom properties must cross the shadow boundary, or the reader would
       * not follow the theme at all. */
      var shadowFg = getComputedStyle(reader.content).color;
      t.check('theme colour reaches inside the shadow root',
              shadowFg && shadowFg !== 'rgb(0, 0, 0)', shadowFg);

      App.theme.apply('system');
      t.eq('system stamps its own attribute',
           document.documentElement.getAttribute('data-theme'), 'system');
      t.check('resolved() names a concrete theme',
              ['light', 'dark'].indexOf(App.theme.resolved()) >= 0, App.theme.resolved());
      t.eq('invalid theme falls back to the default', App.theme.apply('nonsense'), 'green');

      /* Green must be the default, and it must come from CSS rather than from
       * script: with ~1.5MB of inlined JS to parse first, a JS-applied default
       * would render the wrong palette on every load before correcting itself. */
      t.eq('the default theme is green', App.theme.DEFAULT, 'green');
      document.documentElement.removeAttribute('data-theme');
      t.eq('bare :root already paints the default palette',
           getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),
           '#d8e6d0');
      t.eq('an unset preference resolves to green', App.theme.stored(), 'green');
      App.theme.apply('green');

      // ---- reading the original, unconverted ----
      await reader.show(0);
      var convertedText = reader.content.textContent;
      t.has(convertedText, '頭髮', 'converted view shows traditional');

      await reader.setSource('original');
      var originalText = reader.content.textContent;
      t.has(originalText, '头发', 'original view shows the simplified source');
      t.check('original view has no traditional form', originalText.indexOf('頭髮') < 0,
              'traditional text leaked into the original view');
      t.check('marks are suppressed on the original',
              reader.content.querySelectorAll('.amb-mark').length === 0,
              String(reader.content.querySelectorAll('.amb-mark').length));

      await reader.setSource('converted');
      t.eq('switching back restores the converted text',
           reader.content.textContent, convertedText);
      t.check('marks return with the converted view',
              reader.content.querySelectorAll('.amb-mark').length > 0, 'no marks');

      // ---- TOC keeps both labellings ----
      t.check('TOC nodes retain their original labels',
              book.toc[0].originalLabel && book.toc[0].originalLabel.indexOf('干净') >= 0,
              String(book.toc[0].originalLabel));
      t.check('TOC converted label differs from the original',
              book.toc[0].label !== book.toc[0].originalLabel,
              book.toc[0].label);
      t.check('metadata keeps the original title',
              book.metadata.original && book.metadata.original.title === '头发与发展',
              JSON.stringify(book.metadata.original));

      // ---- the original must survive an override made on the converted text ----
      var m = reader.content.querySelector('.amb-mark');
      if (m) m.click();
      await reader.setSource('original');
      t.check('overrides are not replayed onto the original',
              reader.content.querySelectorAll('[data-overridden]').length === 0,
              'override leaked');
      await reader.setSource('converted');

      // ---- reading fonts ----
      var RF = App.readingFonts;
      t.eq('three typeface choices', RF.STYLES.map(function (x) { return x.id; }).join(','),
           'serif,sans,kai');

      /* Glyph region must follow the conversion target, or Hong Kong text gets
       * rendered with Taiwan glyph shapes. */
      t.eq('hk preset maps to hk glyphs', RF.regionFor('hk'), 'hk');
      t.eq('hkp maps to hk glyphs too', RF.regionFor('hkp'), 'hk');
      t.eq('tw preset maps to tw glyphs', RF.regionFor('tw'), 'tw');
      t.eq('twp maps to tw glyphs too', RF.regionFor('twp'), 'tw');
      t.eq('plain traditional defaults to tw glyphs', RF.regionFor('t'), 'tw');

      var hkSerif = RF.stackFor('serif', 'hk');
      var twSerif = RF.stackFor('serif', 'tw');
      t.check('hk and tw serif stacks differ', hkSerif !== twSerif, 'identical');
      t.check('hk serif leads with an HK face', /^"(Noto Serif CJK HK|Source Han Serif HC)"/.test(hkSerif),
              hkSerif.slice(0, 40));
      t.check('tw serif leads with a TC face', /^"Songti TC"/.test(twSerif), twSerif.slice(0, 40));

      t.check('every stack ends in a generic family',
              ['serif', 'sans', 'kai'].every(function (style) {
                return ['hk', 'tw', 'cn'].every(function (r) {
                  return /(serif|sans-serif)$/.test(RF.stackFor(style, r === 'cn' ? 't' : r));
                });
              }), 'a stack has no generic fallback');
      t.check('sans stack is sans-serif terminated',
              /sans-serif$/.test(RF.stackFor('sans', 'hk')), RF.stackFor('sans', 'hk'));
      t.check('every family is quoted',
              RF.stackFor('kai', 'tw').split(', ').slice(0, -1).every(function (f) {
                return f.charAt(0) === '"' && f.charAt(f.length - 1) === '"';
              }), RF.stackFor('kai', 'tw'));
      t.eq('the default typeface is 黑體', RF.DEFAULT, 'sans');
      t.eq('an unknown style falls back to the default',
           RF.stackFor('nonsense', 'tw'), RF.stackFor('sans', 'tw'));

      // ---- the reader applies it ----
      await reader.show(0);
      var css = function () { return reader.shadow.querySelector('style').textContent; };
      /* The default only shows on a reader with NO stored preference. The
       * shared `reader` has been round-tripped through localStorage by earlier
       * assertions, so use a dedicated one rather than clearing storage the
       * override tests depend on. */
      var savedTheme = localStorage.getItem('epub-tc:theme');
      localStorage.clear();
      var freshHost = document.createElement('div');
      document.body.appendChild(freshHost);
      var freshBook = await App.parse.load(await App.fixtures.build('epub2'));
      await App.convert.book(freshBook, 'hk');
      var fresh = App.reader.create(freshHost, freshBook);
      await fresh.show(0);
      t.eq('a reader with no stored preference starts on the default',
           fresh.state.fontStyle, 'sans');
      t.check('and renders with the HK sans stack',
              fresh.shadow.querySelector('style').textContent.indexOf('PingFang HK') >= 0,
              'default stack not applied');
      fresh.destroy(); freshHost.remove();
      if (savedTheme) localStorage.setItem('epub-tc:theme', savedTheme);

      await reader.setFontStyle('sans');
      await reader.setFontStyle('kai');
      t.check('switching to 楷書 changes the stack', css().indexOf('Kaiti TC') >= 0, 'kai not applied');
      t.check('and drops the previous one', css().indexOf('PingFang HK') < 0, 'sans stack lingered');
      await reader.setFontStyle('serif');
      t.check('switching to 明體 applies a serif stack',
              css().indexOf('Noto Serif CJK HK') >= 0, 'serif not applied');
      await reader.setFontStyle('serif');

      /* A book converted to Taiwan forms must render with Taiwan faces. */
      var twBook = await App.parse.load(await App.fixtures.build('epub2'));
      await App.convert.book(twBook, 'tw');
      var twReader = App.reader.create(document.getElementById('stage'), twBook);
      await twReader.show(0);
      var twCss = twReader.shadow.querySelector('style').textContent;
      t.check('a tw-converted book renders with TC faces',
              twCss.indexOf('Songti TC') >= 0 && twCss.indexOf('Noto Serif CJK HK') < 0,
              'stack did not follow the preset');
      twReader.destroy();

      // ---- leading ----
      await reader.setLineHeight(2.2);
      t.check('line height applies', /line-height: 2\.2/.test(css()), 'not applied');
      t.eq('line height is remembered in state', reader.state.lineHeight, 2.2);
      await reader.setLineHeight(1.9);

      // ---- new themes ----
      var ids = App.theme.THEMES.map(function (x) { return x.id; });
      t.check('slate and green are registered',
              ids.indexOf('slate') >= 0 && ids.indexOf('green') >= 0, ids.join(','));
      App.theme.apply('slate');
      t.eq('slate palette applied',
           getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(), '#b0b8c4');
      App.theme.apply('green');
      t.eq('green palette applied',
           getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(), '#d8e6d0');

      /* Both new grounds are light, so their foreground must be dark enough
       * to stay readable. */
      function luminance(hex) {
        var n = parseInt(hex.slice(1), 16);
        var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
          v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      }
      function contrast(a, b) {
        var l1 = luminance(a), l2 = luminance(b);
        return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
      }
      t.check('slate contrast is comfortably readable',
              contrast('#b0b8c4', '#16181c') >= 7, contrast('#b0b8c4', '#16181c').toFixed(1) + ':1');
      t.check('green contrast is comfortably readable',
              contrast('#d8e6d0', '#1f2b1b') >= 7, contrast('#d8e6d0', '#1f2b1b').toFixed(1) + ':1');
      App.theme.apply('system');

      // ---- scroll container ----
      /* The short fixture fits inside the stage, so nothing scrolls and the
       * motions would be measuring clamped zeroes. Use a long chapter. */
      var longBook = await App.parse.load(await App.fixtures.buildLong());
      await App.convert.book(longBook, 'hk');
      reader.destroy();
      var stage = document.getElementById('stage');
      reader = App.reader.create(stage, longBook);
      await reader.show(0);
      t.check('long fixture overflows the stage',
              stage.scrollHeight > stage.clientHeight + 400,
              stage.scrollHeight + ' vs ' + stage.clientHeight);
      t.check('the container is what scrolls, not the shadow host',
              stage.scrollHeight > stage.clientHeight && reader.mount.scrollHeight === reader.mount.clientHeight,
              'stage ' + stage.scrollHeight + '/' + stage.clientHeight +
              ', mount ' + reader.mount.scrollHeight + '/' + reader.mount.clientHeight);

      reader.scrollToStart();
      t.eq('scrollToStart lands at 0', reader.scrollPosition(), 0);
      reader.scrollBy(120);
      t.eq('scrollBy moves the real scroller', reader.scrollPosition(), 120);
      reader.scrollToEnd();
      t.check('scrollToEnd reaches the bottom', reader.scrollPosition() > 0,
              String(reader.scrollPosition()));

      // ---- vim keys ----
      var calls = [];
      var vim = App.keys.create({
        reader: function () { return reader; },
        toggleToc: function () { calls.push('toc'); },
        toggleVertical: function () { calls.push('vertical'); },
        toggleSource: function () { calls.push('source'); },
        toggleMarks: function () { calls.push('marks'); },
        fontBigger: function () { calls.push('bigger'); },
        fontSmaller: function () { calls.push('smaller'); }
      });
      function press(key, target) {
        var ev = new KeyboardEvent('keydown', { key: key, bubbles: true, cancelable: true });
        (target || document).dispatchEvent(ev);
        return ev;
      }

      vim.set(false);
      reader.scrollToStart();
      press('j');
      t.eq('keys do nothing while disabled', reader.scrollPosition(), 0);

      vim.set(true);
      t.check('enabling is reported', vim.isEnabled(), 'not enabled');

      reader.scrollToStart();
      press('j');
      t.eq('j scrolls forward one line', reader.scrollPosition(), App.keys.LINE);
      press('k');
      t.eq('k scrolls back', reader.scrollPosition(), 0);

      /* Counts are the point of vim-style keys; 3j must move three lines. */
      reader.scrollToStart();
      press('3'); press('j');
      t.eq('a count prefix repeats the motion', reader.scrollPosition(), App.keys.LINE * 3);

      reader.scrollToStart();
      press('d');
      t.eq('d scrolls half a viewport', reader.scrollPosition(),
           Math.round(reader.viewportExtent() / 2));

      /* d then u must land exactly back, with no accumulated rounding drift. */
      reader.scrollToStart();
      press('j'); press('j'); press('j');
      var beforeHalfPage = reader.scrollPosition();
      press('d'); press('u');
      t.eq('d then u returns to exactly where it started',
           reader.scrollPosition(), beforeHalfPage);
      press('f'); press('b');
      t.eq('f then b returns to exactly where it started',
           reader.scrollPosition(), beforeHalfPage);

      reader.scrollBy(500);
      press('g'); press('g');
      t.eq('gg returns to the start of the chapter', reader.scrollPosition(), 0);
      press('G');
      t.check('G goes to the end', reader.scrollPosition() > 0, String(reader.scrollPosition()));

      // chapter navigation
      await reader.show(0);
      press('n');
      await wait(60);
      t.eq('n advances a chapter', reader.state.index, 1);
      press('p');
      await wait(60);
      t.eq('p goes back a chapter', reader.state.index, 0);

      // delegated actions
      calls.length = 0;
      ['t', 'v', 'o', 'm', '+', '-'].forEach(function (k) { press(k); });
      t.eq('action keys are delegated in order', calls.join(','),
           'toc,vertical,source,marks,bigger,smaller');

      // help overlay
      t.check('help starts hidden', !vim.helpVisible(), 'visible too early');
      press('?');
      t.check('? opens the help', vim.helpVisible(), 'not opened');
      press('Escape');
      t.check('Escape closes the help', !vim.helpVisible(), 'still open');

      /* Typing in a form control must never be swallowed as a command. */
      var input = document.createElement('input');
      document.body.appendChild(input);
      reader.scrollToStart();
      press('j', input);
      t.eq('keys are ignored inside a form field', reader.scrollPosition(), 0);
      input.remove();

      // unbound keys must pass through
      var ev = press('z');
      t.check('unbound keys are not swallowed', !ev.defaultPrevented, 'z was consumed');
      vim.set(false);

      // ---- persistent library ----
      /* IndexedDB is unreliable from a local file, so the library gates itself
       * on a real origin rather than writing to storage that may vanish. */
      t.check('library is offered over http', App.library.available(), App.library.reason());
      t.check('it explains itself when unavailable',
              App.library.available() ? true : App.library.reason().length > 0, 'no reason given');

      var libBook = await App.parse.load(await App.fixtures.build('epub2'));
      var libBytes = await App.fixtures.build('epub2');

      /* The library and the reader must agree on identity, or a reopened book
       * would not find its saved position. */
      t.eq('library id matches the reader storage key',
           App.library.idFor(libBook), App.reader.hashKey(libBook));

      await App.library.remove(App.library.idFor(libBook));   // clean slate
      var before = await App.library.list();
      var saved = await App.library.save(libBook, libBytes, 'test.epub');
      t.check('a book saves', saved.saved, saved.reason || 'save failed');

      var after = await App.library.list();
      t.eq('it appears in the list', after.length, before.length + 1);
      var row = after.filter(function (r) { return r.id === saved.id; })[0];
      t.check('the entry carries its title', !!row && !!row.title, JSON.stringify(row));
      t.eq('and its size', row ? row.size : 0, libBytes.byteLength);

      var loaded = await App.library.load(saved.id);
      t.check('the stored bytes come back intact',
              loaded && loaded.byteLength === libBytes.byteLength,
              (loaded ? loaded.byteLength : 0) + ' vs ' + libBytes.byteLength);
      var roundTripped = await App.parse.load(loaded);
      t.check('and still parse as an EPUB', !!roundTripped.opfPath, 'reopen failed');

      /* Saving the same book twice must update rather than duplicate. */
      await App.library.save(libBook, libBytes, 'test.epub');
      var afterTwice = await App.library.list();
      t.eq('saving again does not duplicate', afterTwice.length, after.length);

      var huge = { byteLength: App.library.MAX_BYTES + 1 };
      var refused = await App.library.save(libBook, huge, 'huge.epub');
      t.check('an oversized book is refused with a reason',
              !refused.saved && /Too large/.test(refused.reason), JSON.stringify(refused));

      await App.library.remove(saved.id);
      var afterRemove = await App.library.list();
      t.check('removal works',
              !afterRemove.some(function (r) { return r.id === saved.id; }), 'still listed');
      t.eq('and a removed book loads as null', await App.library.load(saved.id), null);

      reader.destroy();
      t.check('destroy removes the mount', !document.querySelector('.reader-mount'), 'mount still present');

    } catch (e) {
      t.check('unexpected exception', false, e && (e.stack || e.message));
    }
    t.finish();
  }

  run();
})();
</script>
</body>
</html>
