<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Responsive layout tests</title>
<style>
  body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 24px; max-width: 900px; }
  h1 { font-size: 16px; }
  .pass { color: #1a7f37; }
  .fail { color: #cf222e; font-weight: 700; }
  #summary { font-size: 16px; font-weight: 700; padding: 12px; margin: 16px 0; border: 2px solid; }
  iframe { position: absolute; left: -9999px; border: 0; }
</style>
</head>
<body>
<h1>EPUB converter — responsive layout</h1>
<div id="summary">running…</div>
<ul id="results"></ul>

<script src="../vendor/jszip.min.js"></script>
<script src="harness.js"></script>
<script>
(function () {
  'use strict';
  var t = Harness.create('results', 'summary');
  var PHONE = 375, DESKTOP = 1200;

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* What "it looks like the buttons beside it" actually means: the space
     between the button's edge and the ink inside it. Comparing BOXES was the
     mistake that shipped -- a bookmark occupies the middle 60% of its square,
     so matching the button's width to a two-character label pushed the ribbon
     further from its own edges rather than closer, and the air each side went
     from 13.3px to 17.3 against a label's 11.4.

     Asserted as two font-independent facts rather than as a measured air
     figure, because the label's ink depends on a CJK font this machine may
     not share with CI: the button takes the same padding as its neighbours,
     and its box carries the ink rather than empty margin. Those two together
     ARE the matching air. The ink is measured off the artwork, so redrawing
     the mark keeps the test honest.

     The mark is drawn into a canvas at 8x and read back, which is also the
     only way to know it is not being clipped by the narrowed box. */
  async function markInk(doc, id) {
    var el = doc.getElementById(id), win = doc.defaultView;
    var before = win.getComputedStyle(el, '::before');
    var raw = before.maskImage;
    if (!raw || raw === 'none') raw = before.webkitMaskImage;
    var url = String(raw).trim().replace(/^url\((["']?)/, '').replace(/(["']?)\)$/, '');
    /* At the size the mask is actually PAINTED, which is not the box: the box
       is a line tall so the button matches its neighbours, and the mark is
       drawn at a fraction of it. Reading the box height here instead would
       measure ink that is never on screen. */
    var lineBox = parseFloat(before.height), S = 8;
    var sz = String(before.maskSize || before.webkitMaskSize || '').trim().split(/\s+/)[1] || '';
    var h = /%$/.test(sz) ? lineBox * parseFloat(sz) / 100 : (parseFloat(sz) || lineBox);
    var img = new win.Image();
    await new Promise(function (res, rej) { img.onload = res; img.onerror = rej; img.src = url; });
    var c = doc.createElement('canvas');
    c.width = Math.ceil(h * S); c.height = Math.ceil(h * S);
    var g = c.getContext('2d');
    g.drawImage(img, 0, 0, c.width, c.height);
    var d = g.getImageData(0, 0, c.width, c.height).data;
    var x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
    for (var y = 0; y < c.height; y++) for (var x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 8) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    return { ink: (x1 - x0 + 1) / S, inkH: (y1 - y0 + 1) / S,
             box: parseFloat(before.width), lineBox: lineBox,
             clipped: x0 <= 0 || x1 >= c.width - 1 };
  }

  /* What a mark inks on screen is its stroke times the fraction of the line it
     is drawn at -- so the stroke alone says nothing, and three marks can carry
     three different numbers and still be one weight, or share a number and
     not be. The shelf shipped at 1.9 against the others' 2.0 and 2.3, which
     reads as 6% light rather than as 0.1 of anything. */
  function markWeight(doc, id) {
    var cs = doc.defaultView.getComputedStyle(doc.getElementById(id), '::before');
    var raw = cs.maskImage;
    if (!raw || raw === 'none') raw = cs.webkitMaskImage;
    var stroke = /stroke-width='([\d.]+)'/.exec(String(raw));
    var fraction = parseFloat(cs.getPropertyValue('--mark-of-line'));
    return stroke && fraction ? parseFloat(stroke[1]) * fraction : null;
  }

  function padOf(doc, id) {
    var cs = doc.defaultView.getComputedStyle(doc.getElementById(id));
    return [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(' ');
  }

  async function checkMarkFits(t, doc, id, name, where) {
    var m = await markInk(doc, id);
    /* Against Aa, which is the last control on this bar still setting its own
       width from text -- 書架 and then 文稿 were the earlier bases and are
       marks themselves now. Comparing one mark to another would pass with
       both of them wrong the same way. */
    t.eq(name + ' is padded like the labels beside it' + where,
         padOf(doc, id), padOf(doc, 'aaBtn'));
    t.check(name + '\'s box carries the ink, not empty margin' + where,
            m.box - m.ink < 3,
            'box ' + m.box.toFixed(1) + ', ink ' + m.ink.toFixed(1) +
            ' -> ' + ((m.box - m.ink) / 2).toFixed(1) + 'px of dead space each side');
    t.check('and the narrowed box does not clip ' + name + where,
            !m.clipped, 'the mark reaches the edge of its box');
    /* Drawn shorter than the line it sits on. Filling the line put 20.1px of
       ink beside characters inking 12.9 -- half again as tall, and reported
       as looking wrong before any of the width work was noticed. Measured
       against the line box rather than against the text, which would drag a
       CJK font into the assertion. */
    t.check('and ' + name + ' is drawn shorter than the line it sits on' + where,
            m.inkH < m.lineBox * 0.8,
            'ink ' + m.inkH.toFixed(1) + 'px tall in a ' + m.lineBox.toFixed(1) +
            'px line -- ' + Math.round(m.inkH / m.lineBox * 100) + '%');
    /* The reason both of these are drawn at all: a character would be chosen
       by font fallback, and fallback follows the interface LANGUAGE. */
    var before = doc.defaultView.getComputedStyle(doc.getElementById(id), '::before');
    t.eq(name + ' is drawn, not set in a font' + where,
         before.content.replace(/\s*\/\s*""$/, ''), '""');
  }


  /* The app is loaded in a real iframe of the target width, so the media
   * queries resolve exactly as they would on a device. */
  function mount(width, height) {
    return new Promise(function (resolve) {
      var f = document.createElement('iframe');
      f.width = width; f.height = height; f.src = '/index.html';
      f.onload = function () {
        /* Kill transitions inside the frame. The drawer slides via a CSS
         * transform transition, and a test frame parked off-screen has its
         * rendering throttled, so the animation may never tick -- measuring
         * an in-flight property would be testing the animation, not the
         * layout. With transitions off, geometry is final immediately. */
        var s = f.contentDocument.createElement('style');
        s.textContent = '*, *::before, *::after { transition: none !important; ' +
                        'animation: none !important; }';
        f.contentDocument.head.appendChild(s);
        resolve(f);
      };
      document.body.appendChild(f);
    });
  }

  /* A page turn on a phone is a gesture, so the test has to make one.
     Constructed rather than emulated: the harness runs a plain browser, and
     what is being checked is the handler's arithmetic -- the threshold, the
     axis lock, the edge guard -- not the platform's touch pipeline. */
  function swipe(doc, x0, y0, x1, y1) {
    var win = doc.defaultView, el = doc.getElementById('viewer');
    function ev(name, x, y) {
      var t = new win.Touch({ identifier: 1, target: el, clientX: x, clientY: y });
      return new win.TouchEvent(name, { bubbles: true, cancelable: true,
        touches: name === 'touchend' ? [] : [t], changedTouches: [t] });
    }
    el.dispatchEvent(ev('touchstart', x0, y0));
    el.dispatchEvent(ev('touchend', x1, y1));
  }

  async function loadBook(frame) {
    var W = frame.contentWindow;
    var zip = new W.JSZip();
    zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });
    zip.folder('META-INF').file('container.xml',
      '<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">' +
      '<rootfiles><rootfile full-path="c.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
    zip.file('c.opf',
      '<?xml version="1.0"?><package xmlns="http://www.idpf.org/2007/opf" version="2.0" unique-identifier="i">' +
      '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>头发与干净的房间里面</dc:title>' +
      '<dc:language>zh-CN</dc:language><dc:identifier id="i">u:m1</dc:identifier></metadata>' +
      '<manifest><item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>' +
      '<item id="c1" href="a.xhtml" media-type="application/xhtml+xml"/>' +
      '<item id="c2" href="b.xhtml" media-type="application/xhtml+xml"/></manifest>' +
      '<spine toc="ncx"><itemref idref="c1"/><itemref idref="c2"/></spine></package>');
    zip.file('toc.ncx',
      '<?xml version="1.0"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">' +
      '<head><meta name="dtb:uid" content="u:m1"/></head><docTitle><text>目录</text></docTitle><navMap>' +
      '<navPoint id="n1" playOrder="1"><navLabel><text>第一章 干净</text></navLabel>' +
      '<content src="a.xhtml"/></navPoint>' +
      '<navPoint id="n2" playOrder="2"><navLabel><text>第二章 头发</text></navLabel>' +
      '<content src="b.xhtml"/></navPoint></navMap></ncx>');
    var paras = '';
    for (var i = 1; i <= 40; i++) paras += '<p>第' + i + '段：她的头发很长，房间很干净，里面有人在吃面条。</p>';
    ['a', 'b'].forEach(function (n) {
      zip.file(n + '.xhtml',
        '<?xml version="1.0"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">' +
        '<head><title>x</title></head><body><h1>第一章</h1>' + paras + '</body></html>');
    });
    var buf = await zip.generateAsync({ type: 'arraybuffer' });
    await W.App.ui.loadBuffer(buf, 'm.epub');
    await wait(120);
    return W;
  }

  function px(el) { return el.getBoundingClientRect(); }

  var setPanelOpen;   // bound once the phone frame exists

  async function run() {
    try {
      // ================= phone =================
      var phone = await mount(PHONE, 812);
      var W = await loadBook(phone);
      var D = phone.contentDocument;
      var doc = D.documentElement;
      var bar = D.getElementById('topbar');
      var sidebar = D.getElementById('sidebar');
      var viewer = D.getElementById('viewer');
      var backdrop = D.getElementById('drawerBackdrop');
      var aaBtn = D.getElementById('aaBtn');
      var aa = D.getElementById('aaPanel');
      setPanelOpen = function (open) {
        if (aa.classList.contains('hidden') === open) aaBtn.click();
      };

      var pagerEl = function () { return D.querySelector('.pager'); };
      /* The bar is addressed by id like every other piece of chrome. It used
         to be the one exception, reached by CSS class from JS -- and the
         anchor inset read it that way, so a rename would have returned null,
         zeroed the inset and put every restored position a bar height out
         without anything looking wrong. */
      t.check('the bar is addressed by id, like everything else',
              !!D.getElementById('topbar'), 'no #topbar');
      t.eq('and it is the element the inset measures',
           D.getElementById('topbar'), D.querySelector('.topbar'));
      t.eq('phone viewport', W.innerWidth, PHONE);
      t.check('no horizontal page overflow', doc.scrollWidth <= doc.clientWidth,
              (doc.scrollWidth - doc.clientWidth) + 'px over');

      /* The headline defect: the reading column was 95px of a 375px screen. */
      t.check('reading column gets the full width', px(viewer).width >= PHONE - 40,
              Math.round(px(viewer).width) + 'px of ' + PHONE);

      t.check('toolbar is a single compact row', px(bar).height <= 70,
              Math.round(px(bar).height) + 'px tall');

      /* The pager floats at the foot on a phone rather than sitting in the
         flow, and tucks away while you read: 55px of a 812px screen was held
         for controls touched a few times a chapter. */
      var pager = pagerEl();
      /* The title used to be dropped below 420px, from when fifteen controls
         needed the room. Five need less, and 匯出 instead of 匯出 EPUB frees
         41px more -- knowing which book you are in beats the last characters
         of its name. */
      /* 100vh on iOS Safari is the LARGE viewport, the height with the URL bar
         hidden, so while that bar shows the app is taller than the screen --
         and since the document never scrolls, its bottom is unreachable. dvh
         tracks what is actually visible. Headless Chromium has no URL bar, so
         this checks the wiring rather than the iOS symptom. */
      /* The DOCUMENT scrolls on a phone, which is the only thing a browser
         watches when deciding to collapse its own chrome; an inner overflow
         container is invisible to it. The shell is therefore as tall as the
         chapter, and the bar and pager are fixed rather than in the flow. */
      t.check('the document is what scrolls',
              D.documentElement.scrollHeight > D.documentElement.clientHeight,
              D.documentElement.scrollHeight + ' vs ' + D.documentElement.clientHeight);
      t.eq('the reader scrolls the document too',
           W.App.ui.current.reader.scrollerKind(), 'document');
      t.check('and the pager is reachable however far down you are',
              px(pagerEl()).bottom <= W.innerHeight + 1,
              Math.round(px(pagerEl()).bottom) + ' vs ' + W.innerHeight);
      if (W.CSS && W.CSS.supports) {
        t.check('sized in dvh where the browser knows it',
                !W.CSS.supports('height', '100dvh') ||
                W.getComputedStyle(D.querySelector('.app')).height !== '',
                'no height resolved');
      }

      t.check('the book title is shown on a phone',
              D.getElementById('bookTitle').getClientRects().length > 0, 'hidden');
      t.check('with room to read some of it',
              px(D.getElementById('bookTitle')).width > 30,
              Math.round(px(D.getElementById('bookTitle')).width) + 'px');
      t.eq('the document button is named the same on a phone',
           D.getElementById('docBtn').getAttribute('aria-label'), '文稿');

      /* Turning a page is a repeated press, and so is A- / A+. Without this
         the browser holds each tap to see whether a second is coming and reads
         a quick pair as a zoom, so every other press goes missing. The effect
         cannot be measured here -- headless has no double-tap -- so the
         property is what gets asserted, which is also the whole of the fix. */
      ['next', 'prev', 'fontBigger', 'aaBtn'].forEach(function (id) {
        t.eq(id + ' gives up double-tap zoom so a fast second press lands',
             W.getComputedStyle(D.getElementById(id)).touchAction, 'manipulation');
      });

      t.eq('the pager leaves the flow on a phone',
           W.getComputedStyle(pager).position, 'fixed');
      t.eq('and so does the bar', W.getComputedStyle(bar).position, 'fixed');
      /* Both out of the flow means the column is the whole screen. A stray
         `.topbar { position: relative }` sitting 260 lines below the phone
         layout used to win on source order and quietly cost 57px. */
      t.check('so the reading column is the whole screen',
              px(viewer).height >= W.innerHeight - 2,
              Math.round(px(viewer).height) + 'px of ' + W.innerHeight);
      t.check('and the panels still hang off the bar', (function () {
        D.getElementById('aaBtn').click();
        var gap = px(D.getElementById('aaPanel')).top - px(bar).bottom;
        D.getElementById('aaBtn').click();
        return gap >= 0 && gap < 12;
      })(), 'panel is not anchored to the bar');

      /* Scroll the document, not the viewer: the viewer stopped scrolling
         when the document took over. */
      var scrollTo = function (top) { W.scrollTo(0, top); };
      t.check('it starts on screen', !pager.classList.contains('tucked'), 'tucked at rest');
      scrollTo(300);
      await wait(120);
      t.check('reading forward tucks it away', pager.classList.contains('tucked'), 'stayed put');
      t.check('and takes the bar with it', bar.classList.contains('tucked'),
              'the bar stayed while the pager left');
      scrollTo(120);
      await wait(120);
      t.check('scrolling back brings it out', !pager.classList.contains('tucked'), 'stayed hidden');
      scrollTo(D.documentElement.scrollHeight);
      await wait(120);
      t.check('and the end of a chapter always shows it',
              !pager.classList.contains('tucked'), 'hidden where 下一章 is wanted');
      scrollTo(0);
      await wait(120);

      /* A panel hangs off the bar, so tucking would carry it off screen. */
      D.getElementById('docBtn').click();
      await wait(60);
      scrollTo(600);
      await wait(150);
      t.check('an open panel keeps the bar in place',
              !bar.classList.contains('tucked'), 'tucked with a panel open');
      D.getElementById('docBtn').click();
      await wait(60);
      scrollTo(0);
      await wait(120);

      var chrome = px(bar).height + px(D.querySelector('.pager')).height;
      t.check('chrome takes under a fifth of the screen', chrome / W.innerHeight < 0.2,
              Math.round(chrome / W.innerHeight * 100) + '%');

      // drawer
      t.eq('sidebar is taken out of the flow',
           W.getComputedStyle(sidebar).position, 'fixed');
      t.check('drawer starts closed', !W.App.ui.drawerOpen(), 'open at load');
      t.check('closed drawer is off-screen', px(sidebar).right <= 1,
              'right edge at ' + Math.round(px(sidebar).right));
      t.check('backdrop hidden while closed', backdrop.classList.contains('hidden'), 'visible');

      D.getElementById('toggleSidebar').click();
      await wait(60);
      t.check('drawer opens over the text', px(sidebar).left >= -1 && px(sidebar).width > 200,
              'left ' + Math.round(px(sidebar).left) + ', width ' + Math.round(px(sidebar).width));
      t.check('backdrop appears with the drawer', !backdrop.classList.contains('hidden'), 'no backdrop');
      t.check('drawer does not shrink the reading column',
              px(viewer).width >= PHONE - 40, Math.round(px(viewer).width) + 'px');

      backdrop.click();
      await wait(60);
      t.check('tapping the backdrop closes the drawer',
              !W.App.ui.drawerOpen(), 'still open');

      // choosing a chapter dismisses the drawer
      D.getElementById('toggleSidebar').click();
      await wait(60);
      var link = D.querySelector('#toc a');
      t.check('TOC rendered links to tap', !!link, 'no links in the drawer');
      if (link) { link.click(); await wait(120); }
      t.check('choosing a chapter dismisses the drawer',
              !W.App.ui.drawerOpen(), 'drawer stayed open');

      // the reading-settings panel
      t.check('reading settings start collapsed',
              W.getComputedStyle(aa).display === 'none', 'panel open at load');
      aaBtn.click();
      await wait(60);
      t.check('Aa opens the reading settings',
              W.getComputedStyle(aa).display !== 'none', 'did not open');
      t.check('panel stays on screen', px(aa).right <= W.innerWidth + 1,
              'overflows by ' + Math.round(px(aa).right - W.innerWidth));
      /* One at a time: opening one panel closes whatever else was open. */
      D.getElementById('docBtn').click();
      await wait(60);
      t.check('opening 文稿 closes Aa',
              W.getComputedStyle(aa).display === 'none', 'both open at once');
      D.getElementById('docBtn').click();
      await wait(60);
      /* Only buttons dismiss the menu, so use one whose effect is trivially
         reversible rather than a control that re-renders the chapter. */
      /* The size steppers are meant to be pressed repeatedly, so they must not
         close the panel under the cursor after the first press. */
      setPanelOpen(true);            // the 轉換 checks above left nothing open
      await wait(60);
      D.getElementById('fontBigger').click();
      await wait(60);
      t.check('the size steppers leave the panel open',
              W.getComputedStyle(aa).display !== 'none', 'closed after one press');
      D.getElementById('fontBigger').click();
      await wait(60);
      t.check('so they can be pressed again without re-opening it',
              W.getComputedStyle(aa).display !== 'none', 'closed on the second press');
      D.getElementById('fontSmaller').click();
      D.getElementById('fontSmaller').click();      // restore the font scale
      await wait(60);

      /* A control that changes what you are looking at does close it. */
      D.getElementById('toggleVim').click();
      await wait(80);
      t.check('a view-changing control closes the panel',
              W.getComputedStyle(aa).display === 'none', 'stayed open');
      D.getElementById('toggleVim').click();        // back off again

      setPanelOpen(true);
      await wait(60);
      t.check('the reading controls are reachable on a phone',
              ['fontStyle', 'theme', 'align', 'lineHeight'].every(function (id) {
                var e = D.getElementById(id);
                return e && e.getClientRects().length > 0;
              }), 'a control is unreachable in the panel');

      /* The sliders share a label column, and English labels are the long ones:
         "Line spacing" and "Line width" against 行距 and 行寬. The narrow panel
         is where that column costs the most, so check it here in the language
         that makes it widest -- the desktop frame proves alignment, this proves
         the track survives it. */
      D.getElementById('lang').click();
      await wait(300);
      setPanelOpen(true);
      await wait(80);
      var pInputs = D.querySelectorAll('#aaPanel .ranges input[type="range"]');
      var pPanel = px(D.getElementById('aaPanel'));
      t.eq('both sliders are laid out on a phone', pInputs.length, 2);
      t.check('and neither runs past the panel',
              Array.prototype.every.call(pInputs, function (i) {
                return px(i).right <= pPanel.right + 1;
              }), 'a slider overflows the panel');
      t.check('with a track still worth dragging',
              px(pInputs[0]).width >= 90,
              Math.round(px(pInputs[0]).width) + 'px of track');
      D.getElementById('lang').click();            // back to Chinese
      await wait(300);
      setPanelOpen(false);

      // touch targets
      function rendered(el) { return el.getClientRects().length > 0; }
      function undersized(nodes) {
        return Array.prototype.slice.call(nodes).filter(rendered)
          .filter(function (b) { return px(b).height < 44; })
          .map(function (b) { return (b.id || b.textContent.trim()) + '=' + Math.round(px(b).height); });
      }

      setPanelOpen(false);
      var barSmall = undersized(D.querySelectorAll('.topbar > button, .pager button'));
      t.check('visible toolbar and pager controls meet the 44px target',
              barSmall.length === 0, barSmall.join(', '));

      /* The collapsed controls need checking too -- once opened they are what
       * the thumb actually lands on. */
      setPanelOpen(true);
      await wait(60);
      var menuSmall = undersized(D.querySelectorAll('#aaPanel button, #aaPanel select'));
      t.check('controls inside the menu meet the 44px target',
              menuSmall.length === 0, menuSmall.join(', '));
      setPanelOpen(false);

      // ================= desktop, unchanged =================
      var desk = await mount(DESKTOP, 800);
      var DW = await loadBook(desk);
      var DD = desk.contentDocument;
      var dSidebar = DD.getElementById('sidebar');
      var dAa = DD.getElementById('aaPanel');

      t.eq('desktop viewport', DW.innerWidth, DESKTOP);
      t.eq('sidebar returns to the flow',
           DW.getComputedStyle(dSidebar).position, 'static');
      t.check('sidebar visible by default on desktop', DW.App.ui.drawerOpen(), 'collapsed');
      t.check('desktop sidebar occupies real width', px(dSidebar).width > 200,
              Math.round(px(dSidebar).width) + 'px');
      /* The panels behave the same at every width now. Fifteen inline controls
         wrapped the bar to two rows at 1280px and left the title 77px, so the
         grouping is not a phone concession. */
      /* The bar's button is a way into the panel, not the action, so it reads
         the same at every width; the format is named on the button that
         actually writes the file, where the format is chosen. */
      t.eq('the bar button is named 文稿',
           DD.getElementById('docBtn').getAttribute('aria-label'), '文稿');
      DD.getElementById('docBtn').click();
      await wait(80);
      t.check('pressing it opens the document panel',
              !DD.getElementById('docPanel').classList.contains('hidden'), 'stayed shut');
      t.eq('and the action names the format',
           DD.getElementById('exportRun').textContent, '匯出 EPUB');
      /* One panel, in reading order: what this book IS, then -- past the rule
         -- the file you can take away. They were two buttons on two sides of
         the title, which is one question asked twice. The order is the whole
         claim here, so it is asserted as a sequence rather than as a set. */
      t.eq('and it holds the conversion and the export, in that order',
           Array.prototype.map.call(
             DD.getElementById('docPanel').querySelectorAll('button,select,input'),

         the control pressed most while reading. Asserted as the strip being
         used end to end, which is what flex:1 does here -- a width in pixels
         would be a claim about this machine's font. */
      var pgrBox = PD.querySelector('.pager').getBoundingClientRect();
      var pvBox = PD.getElementById('prev').getBoundingClientRect();
      var nxBox = PD.getElementById('next').getBoundingClientRect();
      t.check('the page buttons are the same size as each other',
              Math.abs(pvBox.width - nxBox.width) < 1,
              Math.round(pvBox.width) + ' and ' + Math.round(nxBox.width));
      t.check('and between them they use the strip end to end',
              pvBox.left - pgrBox.left <= 20 && pgrBox.right - nxBox.right <= 20,
              'left gap ' + Math.round(pvBox.left - pgrBox.left) +
              ', right gap ' + Math.round(pgrBox.right - nxBox.right));

      /* The gesture, and the three things that must NOT be one. */
      t.eq('the browser can build a touch here', typeof PW.TouchEvent, 'function');
      var midY = Math.round(PW.innerHeight / 2), wide = PW.innerWidth;
      swipe(PD, 250, midY, 120, midY);
      await wait(300);
      var turned = pgLeft();
      t.check('a swipe turns the page', turned > 0, 'scrollLeft still ' + turned);

      swipe(PD, 12, midY, 200, midY);
      await wait(250);
      t.eq('a swipe from the left edge does not -- that is the browser\'s back',
           pgLeft(), turned);
      swipe(PD, wide - 10, midY, 150, midY);
      await wait(250);
      t.eq('nor one from the right edge', pgLeft(), turned);
      swipe(PD, 200, 100, 215, 500);
      await wait(250);
      t.eq('nor a drag down the page', pgLeft(), turned);
      swipe(PD, 200, midY, 220, midY);
      await wait(250);
      t.eq('nor a nudge shorter than the threshold', pgLeft(), turned);

      /* Taps belong to the text: the marks and the links are tapped, which is
         why the page turn is a swipe and not a zone over the column. */
      swipe(PD, 200, midY, 200, midY);
      await wait(250);
      t.eq('and a tap turns nothing', pgLeft(), turned);

      swipe(PD, 120, midY, 260, midY);
      await wait(300);
      t.eq('a swipe the other way goes back', pgLeft(), 0);

      pg.remove();
      window.localStorage.removeItem('epub-tc:paged');

      /* ---- the tallest panel on the shortest window ----
         Aa stood 544px tall when it held eleven controls. On a 560px screen it
         ran off the bottom with Vim 模式 past the edge and nothing could reach
         it: it hangs off the bar, the bar does not scroll here, and while
         paginating nothing scrolls at all. It needs a ceiling and a scroll of
         its own.

         Two controls have left it since -- 行寬, which the screen was always
         narrower than, and 專注閱讀, which cannot run here -- so it no longer
         overflows 560px and a test at that height would prove nothing. Hence
         460, which is a window rather than a phone: the rules are keyed to
         width, and the panel has to survive whatever height comes with it. */
      var short = await mount(PHONE, 460);
      await loadBook(short);
      var SW = short.contentWindow, SD = short.contentDocument;
      SD.getElementById('aaBtn').click();
      await wait(250);
      var aaPan = SD.getElementById('aaPanel');
      t.check('the reading panel stops at the bottom of the screen',
              aaPan.getBoundingClientRect().bottom <= SW.innerHeight + 1,
              Math.round(aaPan.getBoundingClientRect().bottom) + ' of ' + SW.innerHeight);
      /* And the part below the fold is reachable, which the ceiling alone does
         not give: without a scroller of its own the ceiling would simply cut
         the last controls off instead of pushing them past the edge. */
      aaPan.scrollTop = aaPan.scrollHeight;
      await wait(120);
      var lastCtl = SD.getElementById('toggleVim').getBoundingClientRect();
      t.check('and its last control can be scrolled to',
              lastCtl.height > 0 && lastCtl.bottom <= SW.innerHeight + 1 && lastCtl.top >= 0,
              'bottom ' + Math.round(lastCtl.bottom) + ' of ' + SW.innerHeight);

      /* 行寬 asks for 26 to 50em -- 416 to 800px at the reading size -- and the
         screen is narrower than all of it, so the slider moved and nothing
         happened. Hidden here, and only here. */
      t.eq('行寬 is not offered on a phone',
           SD.getElementById('measure').getBoundingClientRect().height, 0);
      /* Nor 專注閱讀. It hides the chrome and waits for a pointer to approach
         an edge to bring it back, and setFocus has always refused below this
         breakpoint -- so it was a greyed control in the one place it can never
         work. Vim 模式 stays: that one is about a keyboard, and a narrow window
         on a laptop has one. */
      t.eq('nor 專注閱讀, which cannot work here',
           SD.getElementById('toggleFocus').getBoundingClientRect().height, 0);
      t.check('but Vim 模式 remains, since the breakpoint is a width',
              SD.getElementById('toggleVim').getBoundingClientRect().height > 0,
              'vim left with it');
      short.remove();

      /* ---- bookmarks ----
         The word 書籤 on the bar cost the title 56px on a phone and all of it
         at 320px, so below the breakpoint the button wears a glyph instead.
         The text stays in the element and only its size goes, so what a screen
         reader announces is unchanged -- asserted here, because a CSS trick
         that quietly removed the name would be worse than the wasted width. */
      var bmBar = LD.getElementById('toggleBookmark');
      t.eq('the bookmark button is on the bar', !!bmBar, true);
      t.eq('and starts unpressed', bmBar.getAttribute('aria-pressed'), 'false');
      /* The desktop half. It was wrong here too -- by less, which is why it
         went unreported: 4px across and 3.2px down. */
      await checkMarkFits(t, LD, 'toggleBookmark', 'the ribbon', '');
      await checkMarkFits(t, LD, 'toggleSidebar', 'the contents mark', '');
      await checkMarkFits(t, LD, 'toggleShelf', 'the shelf mark', '');
      await checkMarkFits(t, LD, 'docBtn', 'the document mark', '');

      /* Heaviest against lightest, not each against the mean. Written the second
         way first, it passed with the shelf back at 1.9: three marks pull the
         mean towards the odd one, so a mark 6.8% lighter than its heaviest
         neighbour sits only 3.9% off the average and slips under any tolerance
         loose enough to allow the ribbon's own 2.7%. */
      var weights = ['toggleShelf', 'toggleSidebar', 'toggleBookmark', 'docBtn']
        .map(function (id) { return markWeight(LD, id); });
      var spread = weights.every(function (w) { return w; })
        ? Math.max.apply(null, weights) / Math.min.apply(null, weights) : 0;
      t.check('the three marks are drawn at one weight',
              spread && spread < 1.04,
              weights.map(function (w) { return w === null ? '?' : w.toFixed(3); }).join(', ') +
              ' -- stroke times the fraction of the line each is drawn at, ' +
              'spread ' + ((spread - 1) * 100).toFixed(1) + '%');
      t.check('with the section hidden while there are none',
              LD.getElementById('bookmarks').classList.contains('hidden'),
              'an empty bookmarks heading on every book');
      bmBar.click();
      await wait(120);
      t.eq('pressing it marks the spot', bmBar.getAttribute('aria-pressed'), 'true');

      /* The button is a ribbon, and the ribbon is DRAWN. Characters were tried
         on this bar and reverted: ≡ ▤ ⇩ sit in ranges the CJK fonts also
         cover, so font fallback -- chosen by LANGUAGE -- rendered them
         full-width on a device whose interface font lacked one, and no
         measurement taken here could see it. A mask takes no font, so the
         guard is that the mark carries no character and that the two states
         are actually different pictures. */
      var bmBefore = LD.defaultView.getComputedStyle(bmBar, '::before');
      var bmText = bmBefore.content.replace(/\s*\/\s*""$/, '');
      t.eq('the mark is drawn, not set in a font', bmText, '""');
      t.check('and it is a mask rather than a background image',
              /url\(/.test(bmBefore.maskImage || bmBefore.webkitMaskImage || ''),
              'no mask: ' + (bmBefore.maskImage || '(none)'));
      var markedMask = bmBefore.maskImage || bmBefore.webkitMaskImage;
      bmBar.click();
      await wait(120);
      var unmarkedMask = LD.defaultView.getComputedStyle(bmBar, '::before').maskImage
                      || LD.defaultView.getComputedStyle(bmBar, '::before').webkitMaskImage;
      t.check('and the hollow one differs from the filled one',
              markedMask !== unmarkedMask, 'both states draw the same ribbon');
      bmBar.click();
      await wait(120);
      t.eq('and the list shows one', LD.querySelectorAll('.bookmark-row').length, 1);
      var bmRow = LD.querySelector('.bookmark-row');
      t.check('labelled with the opening words',
              bmRow.querySelector('.label').textContent.length > 0, 'no label');
      t.check('and with the chapter it is in',
              bmRow.querySelector('.where').textContent.length > 0,
              'no chapter name, so two bookmarks in one book look alike');
      /* One button both ways. */
      bmBar.click();
      await wait(120);
      t.eq('pressing again takes it away', LD.querySelectorAll('.bookmark-row').length, 0);
      t.check('and the heading goes with it',
              LD.getElementById('bookmarks').classList.contains('hidden'), 'heading stayed');

      /* Where the list SITS, which is what made it unfindable. Measured on a
         60-chapter book: underneath the contents it started 1240px below the
         fold of a 643px panel, so reaching three places you marked yourself
         meant scrolling past sixty the publisher named.

         Two properties, because moving it up was not enough on its own -- the
         panel scrolls itself to the chapter being read, and at chapter 52 of
         60 that put the section off-screen ABOVE instead of below. It has to
         come first AND stay put. This fixture's two chapters cannot make the
         panel overflow, so the properties are asserted rather than the
         symptom; the symptom is what they were derived from. */
      var bmSection = LD.getElementById('bookmarks');
      var tocNav = LD.getElementById('toc');
      t.check('the bookmark list comes before the contents',
              !!(bmSection.compareDocumentPosition(tocNav) &
                 LD.defaultView.Node.DOCUMENT_POSITION_FOLLOWING),
              'the contents still come first');
      t.eq('and stays put while the contents scroll under it',
           LD.defaultView.getComputedStyle(bmSection).position, 'sticky');
      t.check('with a ceiling, so a long list cannot take the whole panel',
              /%|px/.test(LD.defaultView.getComputedStyle(bmSection).maxHeight),
              'no max-height: twenty bookmarks would leave no contents');
      t.check('and its own background, or the contents show through it',
              LD.defaultView.getComputedStyle(bmSection).backgroundColor !== 'rgba(0, 0, 0, 0)',
              'transparent while sticky');

      /* The other direction, which is the one that was broken and the one most
         readers see: Chinese is the default, and everything built in JS rather
         than marked up with data-i18n stayed English in it. The conversion
         report was the worst of them, its heading translated over a wholly
         English body, because relabel() rebuilt every list and never it. Each
         of these is prose the interface owns -- no book titles, no file names
         -- so in Chinese each must carry Chinese. */
      LD.getElementById('toggleReport').click();
      await wait(60);
      var han = /[一-鿿]/;
      [['reportBody', 'the conversion report'],
       ['libraryNote', 'the library note']].forEach(function (pair) {
        var node = LD.getElementById(pair[0]);
        t.check(pair[1] + ' speaks Chinese in Chinese',
                !!node && han.test(node.textContent),
                pair[0] + ': ' + (node ? node.textContent.slice(0, 70) : '(missing)'));
      });
      /* Latin left in the report is the publisher's data -- a language tag, a
         font family -- never the terms around it. */
      t.check('and the report terms are translated, not just its heading',
              LD.querySelectorAll('#reportBody dt').length > 0 &&
              Array.prototype.every.call(LD.querySelectorAll('#reportBody dt'),
                function (dt) { return han.test(dt.textContent); }),
              Array.prototype.map.call(LD.querySelectorAll('#reportBody dt'),
                function (dt) { return dt.textContent; }).join(' | '));
      LD.getElementById('toggleReport').click();

      /* The BOOK's language, not the interface's. renderChapter hands back only
         the body, so the shadow tree inherits from <html> -- which follows the
         reader. Reading in English therefore put zh-HK prose under lang="en",
         and Han glyphs are picked by language. Said on the host, it holds
         whichever language the interface is in. */
      t.eq('the interface language is on the document',
           LD.documentElement.getAttribute('lang'), 'zh-Hant');
      t.eq('and the book keeps its own on the reader',
           LD.querySelector('.reader-mount').getAttribute('lang'), 'zh-HK');
      lang.remove();

      /* Remembered, like the theme. */
      window.localStorage.setItem('epub-tc:lang', 'en');
      var keptLang = await mount(DESKTOP, 800);
      await loadBook(keptLang);
      t.eq('a remembered language opens in it',
           keptLang.contentDocument.getElementById('toggleShelf').getAttribute('aria-label'), 'Shelf');
      keptLang.remove();
      window.localStorage.removeItem('epub-tc:lang');

      /* English labels run longer than Chinese ones, and the tightest place for
         that is the pager on a phone: "← Previous chapter" wrapped to two lines
         and took the strip from 55px to 78px, spending height this layout went
         to real trouble to win back. Asserted with room in the threshold,
         because CI renders with a different font set than any desktop -- what
         must not happen is a SECOND LINE, which costs about 23px, and no
         plausible font moves a single row that far. */
      var enPhone = await mount(PHONE, 812);
      await loadBook(enPhone);
      var ep = enPhone.contentDocument;
      ep.getElementById('lang').click();
      await wait(400);
      /* The bar must stay on ONE row with the bookmark button on it, and the
         title must keep some width. Measured when the button was added: spelled
         out as 書籤 it took the title from 90px to 34px on this screen, and the
         glyph gives most of that back. The title is what tells you which book
         you are in, and this bar was trimmed to the controls that earn their
         width precisely so it could have some. */
      var epBar = ep.getElementById('topbar');
      function barRows() {
        var tops = {};
        Array.prototype.forEach.call(epBar.querySelectorAll(':scope > button'),
          function (b) { tops[Math.round(px(b).top)] = 1; });
        return Object.keys(tops).length;
      }
      /* Words with words, glyphs with glyphs. The bookmark button was gated on
         its own rather than with the other three, so between 421 and 700px in
         CHINESE it was the one glyph in a row of word buttons -- a small
         ribbon in a box two thirds the width of its neighbours, which reads as
         an empty button. English never showed it, because at those widths its
         neighbours are glyphs too. Asserted as "no button is much narrower
         than the widest of them", which is the thing you actually see. */
      t.eq('the phone bar stays on one row in English', barRows(), 1);

      /* An English label is three or four times the width of the two characters
         saying the same thing, and this bar has five of them: the title was
         down to 15px here before there was even a bookmark button, and to
         nothing after. Contents, Shelf and Export wear glyphs in English for
         that reason, which is why the title can be asserted in BOTH languages
         now rather than only in the one the bar was laid out for. */
      /* No title assertion in English, and that is a known cost rather than an
         oversight. Five English labels plus 書籤 leave nothing for it on a
         375px screen -- it was 15px before the bookmark button existed and is
         0 with it. Glyphs bought it back and were reverted: on a device whose
         interface font lacks one of the characters, the CJK fallback drew it
         full-width and the icons sat in visibly empty buttons. Words are wrong
         about the title; glyphs were wrong about the icons. The bar not
         WRAPPING is the invariant either way, and that is what is asserted. */

      ep.getElementById('lang').click();
      await wait(400);
      t.eq('and on one row in Chinese', barRows(), 1);
      /* Chinese keeps some, its labels being two characters rather than words.
         Low threshold on purpose: this records what the layout actually gives
         a phone, so a future change that takes the rest of it fails here. */
      t.check('where the title still gets a little room',
              px(ep.getElementById('bookTitle')).width >= 25,
              Math.round(px(ep.getElementById('bookTitle')).width) + 'px of title left');
      /* Chinese wears the glyphs here too. 書架 and 目錄 DO fit at 375px where
         Shelf and Contents do not -- but fitting left the title 47px, about
         two characters of the book you are reading, and glyphs take it to 92,
         more than this bar ever gave it. */
      ep.getElementById('lang').click();
      await wait(400);

      t.eq('the phone pager speaks English', ep.getElementById('next').textContent,
           'Chapter →');
      /* The readout has to be the widest a real book produces, or this proves
         nothing: the two-chapter fixture renders "1 / 2 · 0%", some 40px narrower
         than a long book's, and leaves room the phone does not have. The first
         version of this test passed with labels that demonstrably wrap, for
         exactly that reason. */
      ep.getElementById('position').textContent = '123 / 456 · 100%';
      void ep.getElementById('prev').offsetHeight;
      t.check('and still fits on one row',
              px(ep.querySelector('.pager')).height < 66,
              Math.round(px(ep.querySelector('.pager')).height) + 'px tall');
      ['prev', 'next'].forEach(function (id) {
        t.check('the ' + id + ' button does not wrap',
                px(ep.getElementById(id)).height < 56,
                Math.round(px(ep.getElementById(id)).height) + 'px tall');
      });
      enPhone.remove();
      window.localStorage.removeItem('epub-tc:lang');


      /* Regression guard for the real bug: a frame that starts narrow and is
       * widened afterwards must still show the sidebar, because the default
       * comes from CSS rather than a width sampled once at startup. */
      var late = await mount(320, 700);
      await loadBook(late);
      late.width = 1200;
      await wait(200);
      t.check('widening a frame that started narrow shows the sidebar',
              late.contentWindow.App.ui.drawerOpen(),
              'sidebar stayed collapsed after widening');
      t.check('and it has real width',
              late.contentDocument.getElementById('sidebar').getBoundingClientRect().width > 200,
              Math.round(late.contentDocument.getElementById('sidebar').getBoundingClientRect().width) + 'px');
      late.remove();

      phone.remove();
      desk.remove();
    } catch (e) {
      t.check('unexpected exception', false, e && (e.stack || e.message));
    }
    t.finish();
  }

  run();
})();
</script>
</body>
</html>
