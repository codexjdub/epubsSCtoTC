name: Validate exported EPUBs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  epubcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build the app
        run: ./build.sh

      - name: Audit the build
        run: node tools/audit-dist.js

      # dist/index.html is committed because the README tells people to open
      # it straight from a clone. That only holds if it matches the source.
      - name: Check the committed build is current
        run: git diff --exit-code -- dist/index.html

      # The test pages are the suite. They were only ever opened by hand, so
      # nothing stopped a regression from reaching main.
      - name: Run the browser test suite
        run: node tools/validate/run-tests.js

      # Drives dist/index.html over file://, so this also exercises the
      # double-click path the app is designed around.
      - name: Convert a fixture in a real browser
        run: node tools/validate/export-fixture.js

      # Pinned, and downloaded straight from the release rather than looked up
      # through api.github.com. The API call was unauthenticated, and runners
      # share an IP, so a rate-limited response left $url empty and curl failed
      # on a malformed URL -- a red build caused by nothing in the repository.
      # Pinning also means a new epubcheck cannot change the verdict on a
      # commit that did not touch the exporter; bump it deliberately instead.
      - name: Fetch epubcheck
        env:
          EPUBCHECK_VERSION: 5.3.0
        run: |
          url="https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "using $url"
          curl -fsSL -o epubcheck.zip "$url"
          unzip -q epubcheck.zip -d epubcheck
          find epubcheck -name epubcheck.jar

      # The input is checked too. If the fixture itself were invalid, a failure
      # on the output would say nothing about the conversion; input passing and
      # output failing is the signal that matters.
      - name: Validate the input fixture
        run: |
          jar=$(find epubcheck -name epubcheck.jar | head -1)
          java -jar "$jar" tmp-validate/input.epub

      - name: Validate the converted output
        run: |
          jar=$(find epubcheck -name epubcheck.jar | head -1)
          java -jar "$jar" tmp-validate/converted.epub

      - name: Keep the artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: epubs
          path: tmp-validate/
